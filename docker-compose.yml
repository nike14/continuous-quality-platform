# Runs the whole CQP slice locally. Before the first `docker compose up`, create the dev
# signing key with: uv run python scripts/dev_token.py
# Then CQP is at http://localhost:8080 (see scripts/demo.sh).

x-app: &app
  build: .
  restart: on-failure            # services crash on Kafka/DB errors by design; compose restarts them
  environment:
    CQP_KAFKA: kafka:9092
    CQP_DATABASE_URL: postgresql://cqp:cqp@postgres:5432/cqp
    CQP_JWKS_URL: http://dev-idp:8000/jwks.json
    CQP_RAW_DIR: /data/raw
    CQP_OPA_URL: http://opa:8181
    CQP_POLICY_DIR: /app/policy
    CQP_WEBHOOK_SECRETS: '{"pact-broker": "local-secret", "argo-rollouts": "local-secret", "runtime": "local-secret"}'
  volumes:
    - raw:/data/raw               # ingestion writes raw reports, the store worker reads them
  depends_on:
    kafka-init: {condition: service_completed_successfully}
    postgres: {condition: service_healthy}

services:
  gateway:                        # one CQP_URL for both APIs
    image: caddy:2-alpine
    ports: ["8080:8080"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro"]
    depends_on: [ingestion-api, decision-api]

  ingestion-api:
    <<: *app
    command: ["uvicorn", "cqp.gather.server:app", "--host", "0.0.0.0", "--port", "8080"]

  store-worker:
    <<: *app
    command: ["cqp-store"]

  decision-api:
    <<: *app
    command: ["uvicorn", "cqp.decide.server:app", "--host", "0.0.0.0", "--port", "8090"]

  notifier:
    <<: *app
    command: ["cqp-notify"]       # no CQP_GITLAB_API set: logs what it would post to GitLab

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9094:9094"]          # localhost:9094 for tools on your machine
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      retries: 30

  kafka-init:                     # creates the topics up front; workers won't start without them
    image: apache/kafka:3.8.0
    depends_on: {kafka: {condition: service_healthy}}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - for t in cqp.signals.raw cqp.signals.dlq cqp.decisions; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t --partitions 3;
        done

  postgres:
    image: postgres:16-alpine
    ports: ["5433:5432"]          # psql postgresql://cqp:cqp@localhost:5433/cqp
    environment: {POSTGRES_USER: cqp, POSTGRES_PASSWORD: cqp, POSTGRES_DB: cqp}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "cqp"]
      interval: 2s
      retries: 30

  opa:
    image: openpolicyagent/opa:1.0.0
    command: ["run", "--server", "--addr", "0.0.0.0:8181"]

  dev-idp:                        # stand-in for GitLab's OIDC keys: serves the PUBLIC key only
    image: python:3.12-alpine
    command: ["python", "-m", "http.server", "8000", "-d", "/keys"]
    volumes: ["./dev/public:/keys:ro"]

  prometheus:                     # metrics and alerts for CQP itself: http://localhost:9090/alerts
    image: prom/prometheus:v3.1.0
    ports: ["9090:9090"]
    volumes: ["./ops/prometheus:/etc/prometheus:ro"]

volumes:
  raw:

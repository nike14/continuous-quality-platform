# CQP prototype. `uv sync` installs it; the scripts below are the three entry points
# that aren't web apps (the APIs run under uvicorn, see docker-compose.yml).
[project]
name = "cqp"
version = "0.1.0"
description = "Continuous Quality Platform: evidence gathering"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "confluent-kafka>=2.5",
    "uvicorn>=0.30",
    "psycopg[binary,pool]>=3.2",
    "defusedxml>=0.7",
    "pyyaml>=6.0",
    "prometheus-client>=0.20",
]

[project.scripts]
cqp = "cqp.gather.cli:main"
cqp-store = "cqp.store.worker:main"
cqp-notify = "cqp.notify.worker:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "testcontainers[postgres]>=4.8",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cqp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
